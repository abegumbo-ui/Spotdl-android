name: Build SpotDL APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]          # pushing a tag such as v1.1 publishes a Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag, e.g. v1.1 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write           # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential lld libltdl-dev gettext
          pip install --upgrade pip
          pip install buildozer "cython==0.29.37" setuptools virtualenv

      - name: Cache buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Use the fixed signing key
        # Every build is signed with the same key, so a new APK installs over
        # the previous one instead of being rejected as a different app.
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotDL-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Publish GitHub Release
        # Runs when a v* tag is pushed, or when this workflow is started by
        # hand with a release tag filled in.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp bin/*.apk "SpotDL-Downloader-${TAG}.apk"
          gh release create "$TAG" \
            "SpotDL-Downloader-${TAG}.apk" \
            --title "SpotDL Downloader ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" --latest
