name: Build SpotDL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg build-essential
          pip install buildozer cython==0.29.37
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SpotDL-APK
          path: bin/*.apk
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
